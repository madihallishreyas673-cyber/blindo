name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder and Gradle version
        id: info
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          [ -z "$S" ] && S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "ERROR: settings.gradle not found in the upload."
            exit 1
          fi
          D=$(dirname "$S")
          V=$(grep -h distributionUrl "$D/gradle/wrapper/gradle-wrapper.properties" 2>/dev/null | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || V=8.9
          echo "Project folder: $D   Gradle: $V"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "ver=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.info.outputs.ver }}

      - name: Build debug APK
        working-directory: ${{ steps.info.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuideSight-debug-apk
          path: ${{ steps.info.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
